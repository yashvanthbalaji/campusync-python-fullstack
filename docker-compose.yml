version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: hostelhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: hostelhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  auth-service:
    build: ./auth-service
    container_name: hostelhub-auth
    ports:
      - "8081:8081"
    env_file: ./auth-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/hostelhub_auth
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./auth-service/firebase-credentials.json:/app/firebase-credentials.json

  complaint-service:
    build: ./complaint-service
    container_name: hostelhub-complaint
    ports:
      - "8082:8082"
    env_file: ./complaint-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/hostelhub_complaint
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./complaint-service/firebase-credentials.json:/app/firebase-credentials.json
      - complaint_uploads:/app/uploads

  lost-found-service:
    build: ./lost-found-service
    container_name: hostelhub-lostfound
    ports:
      - "8083:8083"
    env_file: ./lost-found-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/hostelhub_lostfound
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./lost-found-service/firebase-credentials.json:/app/firebase-credentials.json
      - lostfound_uploads:/app/uploads

  notification-service:
    build: ./notification-service
    container_name: hostelhub-notification
    ports:
      - "8084:8084"
    env_file: ./notification-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/hostelhub_notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hostelhub-frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - complaint-service
      - lost-found-service
      - notification-service

volumes:
  postgres_data:
  complaint_uploads:
  lostfound_uploads:
